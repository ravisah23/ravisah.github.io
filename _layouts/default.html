<!DOCTYPE html>
<html lang='{{ site.lang | default: "en-US" }}'>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% seo %}

    <link rel="stylesheet" href='{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}''>

    <!--[if lt IE 9]>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    <link rel="stylesheet" href='{{ "/assets/css/custom.css" | relative_url }}'>
    {% include head-custom.html %}
  </head>

  <body>
    <div class="wrapper">

      <header>

        <h1>
          <a href='{{ "/" | absolute_url }}'>
            {{ site.title | default: site.github.repository_name }}
          </a>
        </h1>

        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" class="profile-photo">
        {% endif %}

        <p>
          {{ site.description }}
        </p>

        <div class="contact-links">

          <a href="https://www.linkedin.com/in/ravi-kumar-sah-058324128/" target="_blank">
            LinkedIn
          </a>

          <a href="mailto:ravisah.ghy@gmail.com">
            Email
          </a>

          <a href="tel:+919706621996">
            +91 9706621996
          </a>

          <span>
            Bengaluru, Karnataka
          </span>

        </div>

      </header>

      <section>
        {{ content }}
      </section>

      <footer>
        <p>
          <small>
            © {{ "now" | date: "%Y" }} Ravi Kumar Sah
          </small>
        </p>
      </footer>

    </div>

    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
